services:
  # アプリケーション
  app:
    image: ghcr.io/highemerly/hosteka:v1.4.18
    container_name: hosteka-app
    ports:
      - "3000:3000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - hosteka-network

networks:
  hosteka-network:
    driver: bridge
