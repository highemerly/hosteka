# 開発環境用オーバーライド設定
# docker-compose up で自動的に読み込まれる

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: hosteka:local
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: hosteka-postgres
    command: postgres -c timezone=UTC
    environment:
      POSTGRES_DB: handon_login
      POSTGRES_USER: handon_user
      POSTGRES_PASSWORD: handon_password
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U handon_user -d handon_login"]
      timeout: 20s
      retries: 10
    restart: unless-stopped
    networks:
      - hosteka-network
