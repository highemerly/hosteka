name: E2E

# 本番と同じイメージを、Postgres と偽 Fediverse サーバーと一緒に起動して Playwright を回す。
# ci.yml（ブランチ push・差分で必要なときだけ。イメージはここでビルドし、push しない）と
# docker-build.yml（タグ push・push 済みのイメージで）から呼ぶ。手順は手元でも同じ（e2e/compose.yml の冒頭）。
on:
  workflow_call:
    inputs:
      # 指定するとビルドせず、このイメージ（push 済み）で回す。タグ時に、デプロイするイメージ
      # そのものを確かめるため（作り直したイメージで通っても、本番に出すものの確認にならない）。
      image:
        type: string
        default: ''

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # GHCR のパッケージは非公開。push 済みのイメージと buildcache を読むのに要る
      packages: read
    env:
      # e2e/compose.yml の app が使うイメージ
      E2E_IMAGE: ${{ inputs.image || 'hosteka:e2e' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: ${{ !inputs.image }}
        uses: docker/setup-buildx-action@v4

      # タグ時のビルド（docker-build.yml）が積む buildcache を読む。lockfile が同じなら
      # 依存のインストールは飛ばされ、実質 next build だけになる。
      - name: Build production image (no push)
        if: ${{ !inputs.image }}
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: hosteka:e2e
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Playwright を使うだけなので、ネイティブビルドは要らない
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # 偽 Fediverse サーバーの証明書は毎回作る（秘密鍵をリポジトリに置かない）
      - name: Generate certificates for fake Fediverse servers
        run: e2e/fakeverse/gen-certs.sh

      - name: Start app, database and fake Fediverse servers
        run: docker compose -f e2e/compose.yml up -d --wait

      - name: Apply migrations
        run: docker compose -f e2e/compose.yml exec -T postgres sh /migrate.sh

      - name: Run E2E
        run: npx playwright test -c e2e/playwright.config.ts

      - name: Collect logs on failure
        if: failure()
        run: docker compose -f e2e/compose.yml logs app fakeverse > e2e/app.log 2>&1 || true

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e/app.log
          if-no-files-found: ignore
