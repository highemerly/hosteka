name: CI

# テストゲート。全ブランチへの push で checks.yml（vitest / eslint / tsc）と
# e2e.yml（本番イメージを起動してのスモーク）を回す。main の必須チェックは checks だけ。
# タグ push（リリース）は branches フィルタに一致しないためここでは発動せず、
# docker-build.yml 側が同じ checks.yml をビルドと並走させる（＝二重実行しない）。
on:
  push:
    branches:
      - '**'

# 同一ブランチの古い実行はキャンセルして CI 分を節約する。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  # 本番と同じイメージのビルド（push はしない）と、起動してのスモーク
  e2e:
    uses: ./.github/workflows/e2e.yml
