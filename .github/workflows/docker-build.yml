name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*'
  # 作り直し用。入力はそのままイメージタグと k8s マニフェストの版になる（`v` は外れない）ので、
  # タグ push 時と揃えて `v` を付けずに入れる。既定値は置かない（以前は latest で、そのまま実行すると
  # マニフェストが :latest になり得た）。
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag without "v" (e.g., 2.0.2)'
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # 公開URL。静的なページにリンクカードの画像の絶対URLを焼き込むため、ビルドのときに渡す
  # （e2e.yml のブランチのビルドも同じ値を渡す）
  PUBLIC_URL: https://hosteka.piyo.me

jobs:
  # ブランチでは差分で間引いた検査を、リリースでは全部回す。定義はブランチの CI と同じ
  # 再利用ワークフロー（二重に書かない）。checks は build と並走する。
  checks:
    uses: ./.github/workflows/checks.yml

  # E2E。push したばかりの本番イメージそのもの（＝デプロイするもの）で回す。
  # 作り直したイメージで通っても、本番に出すものの確認にならない
  e2e:
    needs: build
    uses: ./.github/workflows/e2e.yml
    permissions:
      contents: read
      # GHCR のパッケージは非公開。push 済みのイメージを pull するのに要る
      packages: read
    with:
      image: ${{ needs.build.outputs.image }}

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      # E2E が pull するイメージ（metadata-action の {{version}} / workflow_dispatch の tag と同じ値）
      image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
      # release のノートの起点。前回のタグが無ければ空
      prev_tag: ${{ steps.prev.outputs.prev_tag }}
      has_migration: ${{ steps.prev.outputs.has_migration }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # 前回のタグとの差分を取るため履歴ごと取る
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 入力は `${{ }}` で run: に直接埋めない（シェルの文字列として解釈され、
      # 値に `"` や `$(...)` があればそのまま実行される）。環境変数で渡す
      - name: Extract version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "version=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Find previous tag and migration changes
        id: prev
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "prev_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
          if [ -n "$PREV_TAG" ] && git diff --name-only "$PREV_TAG" HEAD | grep -q "^prisma/migrations/"; then
            echo "has_migration=true" >> "$GITHUB_OUTPUT"
            echo "Migration files changed since $PREV_TAG"
          else
            echo "has_migration=false" >> "$GITHUB_OUTPUT"
            echo "No migration changes since ${PREV_TAG:-(no previous tag)}"
          fi

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # Dockerfile の RUN --mount=type=cache（npm・.next/cache）は type=registry のキャッシュでは
      # 永続化されないので、actions/cache 経由で往復させて Next.js のビルドを差分化する
      - name: Restore build cache mounts
        uses: reproducible-containers/buildkit-cache-dance@v3.4.0
        with:
          cache-map: |
            {
              "var-cache-npm": "/root/.npm",
              "var-cache-next": "/app/.next/cache"
            }
          skip-extraction: false

      # イメージ自体は検査の結果を待たずに push され、latest も動く。本番は版を固定していて
      # latest をデプロイに使わない（docs/development.md「リリース」）。
      # ブランチの E2E（e2e.yml）も同じ buildcache を読む。GitHub Actions のキャッシュ（type=gha）は
      # タグの実行で積んだものをブランチから読めないので、レジストリに置く
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          platforms: linux/amd64
          build-args: NEXTAUTH_URL=${{ env.PUBLIC_URL }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,compression=zstd,compression-level=3

  # GitHub Release をタグごと（パッチも含む）に作る。全検査が通ったときだけ＝Release がある版はデプロイしてよい版。
  # ノートは GitHub の自動生成（前回のタグからマージされた PR の一覧・英語。分類は .github/release.yml）。
  # 同じノートを create-k8s-pr がマニフェストのリポジトリへの PR 本文に使う（変更の一覧の出どころを1つにする）。
  release:
    needs: [build, checks, e2e]
    runs-on: ubuntu-latest
    permissions:
      # generate-notes API も Release の作成も contents: write が要る
      contents: write
    outputs:
      notes: ${{ steps.notes.outputs.notes }}

    steps:
      # 前回のタグは明示する。省くと GitHub は前回の「Release」を起点にするが、
      # v2.0.1 以前は Release を作っていない。
      # workflow_dispatch（作り直し）でタグが無いときは target_commitish の時点で生成される
      - name: Generate release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          PREV_TAG: ${{ needs.build.outputs.prev_tag }}
        run: |
          args=(-f tag_name="v$VERSION" -f target_commitish="$GITHUB_SHA")
          if [ -n "$PREV_TAG" ]; then args+=(-f previous_tag_name="$PREV_TAG"); fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${args[@]}" --jq .body > "$RUNNER_TEMP/notes.md"
          {
            echo "notes<<NOTES_EOF"
            cat "$RUNNER_TEMP/notes.md"
            echo
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      # 作り直し（workflow_dispatch）では Release は作らない（タグが無い・既にある）
      - name: Create release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"

  create-k8s-pr:
    # 検査が全部（ビルド・checks・E2E）通ったときだけ k8s マニフェストへ PR する（release が同じ条件で
    # 待っているので、それを待てば足りる）。マニフェストのリポジトリは Flux で同期しているので、
    # この PR のマージがそのまま本番へのデプロイになる。
    needs: [build, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # マニフェストのリポジトリは非公開。このリポジトリの Actions のログは誰でも読めるので、リポジトリ名と
      # マニフェストのパス（同じイメージを使う prd のもの、スペース区切り）もシークレットに置き、ログでは伏せる
      K8S_REPO: ${{ secrets.K8SG1_REPO }}
      K8S_MANIFEST_PATHS: ${{ secrets.K8SG1_MANIFEST_PATHS }}

    steps:
      - name: Checkout k8s repo
        uses: actions/checkout@v7
        with:
          repository: ${{ env.K8S_REPO }}
          token: ${{ secrets.K8SG1_PAT }}
          path: k8s-repo

      # マニフェストの書式が変わって sed が何も書き換えないと、差分が無いので create-pull-request は
      # PR を作らずに黙って成功する（＝デプロイされないのに緑）。書き換わったことを確かめて落とす
      - name: Update image tag
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        working-directory: k8s-repo
        run: |
          repo="${IMAGE%:*}"
          for p in $K8S_MANIFEST_PATHS; do
            sed -i "s|image: ${repo}:.*|image: ${IMAGE}|" "$p"
            grep -q "image: ${IMAGE}$" "$p" || { echo "::error file=$p::image line not updated"; exit 1; }
          done

      # 本文は英語・全アプリ共通の書式（イメージ・ビルドのリンク・release ジョブが生成したノート）。
      # ノートの PR は完全な URL で書かれるので、マニフェストのリポジトリの #N へのリンクに化けない。
      # マイグレーションの節だけはこのリポジトリ固有。当てるのはマージ＝イメージ差し替えの前
      # （docs/development.md「リリース」）。接続の手順はマニフェストのリポジトリの手順書にあり、ここには書かない。
      - name: Write PR body
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          NOTES: ${{ needs.release.outputs.notes }}
          HAS_MIGRATION: ${{ needs.build.outputs.has_migration }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "- Image: \`$IMAGE\`"
            echo "- Build: $RUN_URL"
            echo
            printf '%s\n' "$NOTES"
            if [ "$HAS_MIGRATION" = "true" ]; then
              echo
              # heredoc の中身と終端は `{` と同じ字下げに置く（YAML が字下げを外すと終端が行頭に来る）
              cat <<'MIGRATION'
          > [!WARNING]
          > This release includes DB migrations. Back up the database and apply them (`npm run deploy:migrate`) before merging.
          > The steps to reach the production database are in this repository's service doc for hosteka.
          MIGRATION
            fi
          } > "$RUNNER_TEMP/pr-body.md"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          path: k8s-repo
          token: ${{ secrets.K8SG1_PAT }}
          branch: update-hosteka-${{ needs.build.outputs.version }}
          delete-branch: true
          commit-message: Update hosteka to ${{ needs.build.outputs.version }}
          title: Update hosteka to ${{ needs.build.outputs.version }}
          body-path: ${{ runner.temp }}/pr-body.md
          # app-update: マニフェストのリポジトリに大量に来る PR のうちアプリの版上げを見分ける（全アプリ共通）。
          # アプリ名はタイトルにあるのでアプリ別のラベルは付けない
          labels: |
            app-update
            ${{ needs.build.outputs.has_migration == 'true' && 'requires-migration' || '' }}
