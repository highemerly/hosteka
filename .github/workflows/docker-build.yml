name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (e.g., v1.4.2)'
        required: true
        default: 'latest'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  K8S_REPO: highemerly/k8sg1-repo
  K8S_MANIFEST_PATH: manifests/hosteka/prd/web.yaml

jobs:
  # ブランチでは差分で間引いた検査を、リリースでは全部回す。checks は build と並列に走り、
  # e2e は push したイメージそのもので回す。全部が緑のときだけ create-k8s-pr が動く。
  checks:
    uses: ./.github/workflows/checks.yml

  e2e:
    needs: build
    uses: ./.github/workflows/e2e.yml
    permissions:
      contents: read
      packages: read
    with:
      image: ${{ needs.build.outputs.image }}

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      has_migration: ${{ steps.migration.outputs.has_migration }}
      image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 入力は `${{ }}` で run: に直接埋めない（シェルの文字列として解釈され、
      # 値に `"` や `$(...)` があればそのまま実行される）。環境変数で渡す
      - name: Extract version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "version=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for migration changes
        id: migration
        run: |
          # 前のタグを取得
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            if git diff --name-only "$PREV_TAG" HEAD | grep -q "^prisma/migrations/"; then
              echo "has_migration=true" >> $GITHUB_OUTPUT
              echo "Migration files changed since $PREV_TAG"
            else
              echo "has_migration=false" >> $GITHUB_OUTPUT
              echo "No migration changes since $PREV_TAG"
            fi
          else
            echo "has_migration=false" >> $GITHUB_OUTPUT
            echo "No previous tag found"
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # ブランチの E2E（e2e.yml）も同じ buildcache を読む。GitHub Actions のキャッシュ（type=gha）は
          # タグの実行で積んだものをブランチから読めないので、レジストリに置く
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

  create-k8s-pr:
    # ビルド・checks・E2E（push したイメージで）が全部成功したときだけ k8s マニフェストへ PR する。
    # イメージ自体はテスト結果に関わらず GHCR へ push されるが、
    # デプロイのトリガである GitOps PR はテストが緑でなければ開かない。
    needs: [build, checks, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout k8s repo
        uses: actions/checkout@v7
        with:
          repository: ${{ env.K8S_REPO }}
          token: ${{ secrets.K8SG1_PAT }}
          path: k8s-repo

      - name: Update image tag
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          cd k8s-repo
          sed -i "s|image: ghcr.io/highemerly/hosteka:.*|image: ghcr.io/highemerly/hosteka:${VERSION}|" "$K8S_MANIFEST_PATH"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          path: k8s-repo
          token: ${{ secrets.K8SG1_PAT }}
          branch: update-hosteka-${{ needs.build.outputs.version }}
          commit-message: "Update hosteka to ${{ needs.build.outputs.version }}"
          title: "Update hosteka to ${{ needs.build.outputs.version }}"
          body: |
            ## Changes
            - Update image: `ghcr.io/highemerly/hosteka:${{ needs.build.outputs.version }}`

            ## Migration
            ${{ needs.build.outputs.has_migration == 'true' && '⚠️ **このリリースにはDBマイグレーションが含まれます**' || '✅ マイグレーション不要' }}

            ${{ needs.build.outputs.has_migration == 'true' && '### マイグレーション実行手順' || '' }}
            ${{ needs.build.outputs.has_migration == 'true' && '```bash' || '' }}
            ${{ needs.build.outputs.has_migration == 'true' && 'kubectl port-forward -n shared-postgres-prd svc/postgres-rw 15432:5432' || '' }}
            ${{ needs.build.outputs.has_migration == 'true' && 'DATABASE_URL="postgresql://<username>:<password>@localhost:15432/hosteka?schema=public" npx prisma migrate status' || '' }}
            ${{ needs.build.outputs.has_migration == 'true' && 'DATABASE_URL="postgresql://<username>:<password>@localhost:15432/hosteka?schema=public" npm run deploy:migrate' || '' }}
            ${{ needs.build.outputs.has_migration == 'true' && '```' || '' }}

            ---
            🤖 Auto-generated by GitHub Actions
          labels: |
            hosteka
            ${{ needs.build.outputs.has_migration == 'true' && 'requires-migration' || '' }}
